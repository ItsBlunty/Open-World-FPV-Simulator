name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @owfpv/fly build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: apps/fly/dist

  # Playtest build at https://itsblunty.github.io/Open-World-FPV-Simulator/ (owner's choice, 2026-10-17).
  # Needs the repository's Settings > Pages > Source set to "GitHub Actions".
  pages:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
